- name: HostName Configuring
  ansible.builtin.shell: set-hostname {{ comp }}-{{ env }}

- name: Disabling default "{{ package }}" vesrion
  ansible.builtin.shell: dnf module disable "{{ package }}" -y

- name: Enabling default "{{ package }}" vesrion
  ansible.builtin.shell: dnf module enable "{{ package }}":"{{ version }}" -y 

- name: Installing "{{ package }}"
  ansible.builtin.package:
    name: "{{ package }}"
    state: present

- name: App user
  ansible.builtin.user:
    name: "{{ appuser }}"
    state: present
    create_home: yes

- name: Remove folder for new "{{ appdir }}"
  ansible.builtin.file:
    path: "{{ appdir }}"
    state: absent 

- name: New folder for "{{ package }}"
  ansible.builtin.file:
    path: "{{ appdir }}"
    state: directory    

- name: Download and Extract {{ comp }}
  ansible.builtin.unarchive: 
    src: "{{ url }}"
    dest: " {{ appdir }}"
    remote_src: yes

- name: Genrating arttifacts of packages
  community.general.npm:
    path: "{{ appdir }}"

- name: Updating Nginx conf 
  ansible.builtin.template:
    src: catalogue.service
    dest: /etc/systemd/system/{{ comp }}.service  

- name: Starting services
  ansible.builtin.service:
    name: "{{ package }}"
    enabled: yes
    state: restarted