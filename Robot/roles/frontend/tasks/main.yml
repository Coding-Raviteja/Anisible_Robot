- name: Disabling default Nginx vesrion
  ansible.builtin.shell: 
    module_disable:
      - nginx 
    state: absent 

- name: Enabling default Nginx vesrion
  ansible.builtin.dnf:
    name: nginx
    state: present 
    module_enable:
      - nginx:1.24 

- name: Installing Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Starting services
  ansible.builtin.service:
    name: nginx
    module: yes
    state: present