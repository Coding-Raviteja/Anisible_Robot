rabbitmq_pass: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=kv/data/rabbitmq-' ~ env ~ ':rabbitmq_pass token=' ~ token ~ ' url=http://vault-tool.robobuy.site:8200 validate_certs=false') }}"